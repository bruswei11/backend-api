spring.application.name=backend-api

# Todo lo que cambia entre la PC del colegio y un servidor en la nube se toma de variables de
# entorno; el valor después de ":" es el que se usa en la PC del Departamento (sin configurar nada).
server.port=${PORT:8080}

# Misma base que ya usa el escritorio (ver Conexion.java en el proyecto SistemaPsicologia).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/psicologia}
spring.datasource.username=${DB_USUARIO:root}
spring.datasource.password=${DB_PASSWORD:}
# Sin driver fijo: MySQL (jdbc:mysql://...) en la PC del colegio, PostgreSQL (jdbc:postgresql://...)
# en Supabase. Pocas conexiones: los planes gratuitos limitan cuántas se pueden abrir.
spring.datasource.hikari.maximum-pool-size=${DB_MAX_CONEXIONES:5}

# Clave para firmar los JWT (HS256, al menos 32 caracteres). El valor por defecto es solo para la
# red local del colegio: en la nube SIEMPRE se define JWT_SECRET con un valor propio y secreto.
app.jwt.secret=${JWT_SECRET:7753bd7496f7b4b00f613dc91dcb7c41f404a594b45eab638b8017e016415e49}

# Carpeta de adjuntos. En la PC apunta a la misma carpeta que usa el escritorio.
app.adjuntos.carpeta=${ADJUNTOS_CARPETA:C:/Users/bru/OneDrive/Documentos/NetBeansProjects/SistemaPsicologia/adjuntos}
# true = los archivos adjuntos se guardan dentro de la base (servidores sin disco permanente, como
# Render gratis). En la PC del colegio quedan en la carpeta, igual que el escritorio.
app.adjuntos.en-base=${ADJUNTOS_EN_BASE:false}

# Base nueva y vacía (servidor en la nube): crea las tablas al arrancar. Con APP_DATOS_DEMO=true
# además carga usuarios y estudiantes INVENTADOS para probar. Nunca activar demo sobre datos reales.
app.base.crear-tablas=${APP_CREAR_TABLAS:false}
app.base.datos-demo=${APP_DATOS_DEMO:false}

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Versión web: el navegador siempre pregunta si hay una versión nueva (si no cambió, el servidor
# responde "sin cambios" y carga igual de rápido). Así, después de una actualización, nadie necesita
# recargar la página a mano para ver los cambios.
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.use-last-modified=true
